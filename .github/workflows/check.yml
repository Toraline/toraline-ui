# Runs the same checks as "make check" on every pull request to v2.
name: Check

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The story tests of the catalog run in a real browser. This step downloads
      # that browser (Chromium with no window) and the system libraries it needs.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: make check
