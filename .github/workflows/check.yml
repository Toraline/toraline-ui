# Runs the same checks as "make check" on every pull request to main.
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The story tests of the catalog run in a real browser. This step downloads
      # that browser (Chromium with no window) and the system libraries it needs.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: make check
